# Admin-role screenshot walkthrough: login -> every tab in AdminTabs
# (navigation/AdminTabs.tsx, verified against the current tab list, not
# assumed): Orders (Admin Dashboard), Catalogue, Customers, Ledger —
# icon-only now, tapped by tabBarButtonTestID since there's no label text
# to tap on. Branches/Staff moved out of the tab bar into the Setup screen
# (reached via the Overview header's Setup icon) — see AdminStack.tsx/
# SetupScreen.tsx. Read-only navigation only — no data is created or
# changed by this flow, unlike staff-flow.yaml.
#
# Run via `npm run screenshots` in /mobile — see /mobile/.maestro/README.md
# for required env vars and how this actually gets launched against Expo Go.
#
# Login no longer has an Admin/Staff toggle — role always comes from the
# looked-up `users` row. ADMIN_TEST_PHONE below MUST be a real admin phone
# number already seeded in the target database (e.g. one of the two live
# accounts documented in repo-root CLAUDE.md's "Admin accounts" section).
appId: ${MAESTRO_APP_ID}
---
- launchApp:
    clearState: false

- tapOn:
    id: "login-phone-input"
- inputText: "${ADMIN_TEST_PHONE}"
- takeScreenshot: 01_login_admin

- tapOn:
    id: "login-submit-button"

- tapOn:
    id: "login-otp-input"
- inputText: "${MOCK_OTP}"
- tapOn:
    id: "login-submit-button"

- assertVisible: "Overview"
- takeScreenshot: 02_admin_dashboard

- tapOn:
    id: "tab-catalogue"
- assertVisible: "Garment Catalogue"
- takeScreenshot: 03_garment_catalogue

- tapOn:
    id: "tab-customers"
- takeScreenshot: 04_customer_management

- tapOn:
    id: "tab-ledger"
- takeScreenshot: 05_ledger_aging

- tapOn:
    id: "tab-orders"
- tapOn:
    id: "setup-button"
- assertVisible: "Setup"
- takeScreenshot: 06_setup

- tapOn: "Branches"
- takeScreenshot: 07_branches
- back
- tapOn:
    id: "setup-button"

- tapOn: "Staff"
- takeScreenshot: 08_staff_management
